# OPTIONAL EXAMPLE: hosted CI is not required by the local Agentic SDLC baseline.
# If enabled, keep it thin and delegate quality policy to `make ci`.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate agentic harness
        run: make harness-check
      # Add the selected stack's pinned runtime/toolchain setup here.
      # Keep stack-specific installation out of this generic workflow until the profile is selected.
      - name: Verify
        run: make ci
