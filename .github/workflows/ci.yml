name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Check npm version
        run: test "$(npm --version)" = '11.19.0'
      - name: Install pinned security tools
        run: bash ./scripts/ci/install-security-tools.sh
      - name: Restore project dependencies and Chromium
        run: make bootstrap
      - name: Install Chromium native dependencies
        run: npx --no-install playwright install-deps chromium
      - name: Run canonical CI contract
        run: make ci
